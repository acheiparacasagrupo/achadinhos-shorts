name: Achadinhos Shorts (automático)

on:
  schedule:
    # horários em UTC -> 11:17, 17:17 e 21:17 em Brasília (UTC-3)
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gerar o vídeo, sem publicar (true/false)"
        default: "false"
      videos:
        description: "Quantos Shorts nesta execução"
        default: "1"

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt && pip install -U yt-dlp

      - name: Cookies do YouTube (opcional, ajuda a baixar vídeos do YouTube)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        if: env.YT_COOKIES != ''
        run: printf '%s' "$YT_COOKIES" > cookies.txt

      - name: Gerar e publicar Shorts
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          WHATSAPP_LINK: ${{ vars.WHATSAPP_LINK }}
          LINK_TEMPLATE: ${{ vars.LINK_TEMPLATE }}
          TITLE_HASHTAGS: ${{ vars.TITLE_HASHTAGS }}
          DESC_HASHTAGS: ${{ vars.DESC_HASHTAGS }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          ALLOW_YOUTUBE_SEARCH: ${{ vars.ALLOW_YOUTUBE_SEARCH }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
          VIDEOS_PER_RUN: ${{ github.event.inputs.videos || vars.VIDEOS_PER_RUN || '1' }}
        run: python -u -m src.main

      - name: Salvar vídeo gerado (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico (evita repetir produto)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json || true
          git diff --cached --quiet || (git commit -m "histórico: novo short [skip ci]" && git push)
